name: Build

# Every push and PR builds the resource and uploads the zip as a workflow artifact.
# Pushes to main also refresh the rolling "dev" prerelease; pushing a version tag
# (e.g. 3.1.0, must match fxmanifest.lua) publishes a stable release.
# Dev builds stay prereleases: ox_lib's lib.versionCheck ignores prereleases, so
# servers only get "update available" for stable releases.

on:
  push:
    branches: ['**']
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: microsoft/setup-msbuild@v3

      - name: Build
        run: msbuild vMenu.sln -restore -p:Configuration=Release -m -v:minimal

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Check client DLL for sandbox-banned types
        run: |
          pip install --quiet dnfile
          python .github/scripts/check_client_dll.py build/vMenu/vMenuClient.net.dll

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $manifest = 'build/vMenu/fxmanifest.lua'
          $text = Get-Content $manifest -Raw
          if ($text -notmatch "(?m)^version\s+'([^']+)'") { throw "No version line in $manifest" }
          $version = $Matches[1]

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -ne $version) {
              throw "Tag $($env:GITHUB_REF_NAME) does not match fxmanifest.lua version $version"
            }
            $name = $version
          } else {
            $name = "$version-dev.$($env:GITHUB_SHA.Substring(0, 7))"
            $text = $text -replace "(?m)^version\s+'[^']+'", "version '$name'"
            Set-Content $manifest $text -NoNewline
          }

          "name=$name" >> $env:GITHUB_OUTPUT
          "zip=vMenu-ox.$name.zip" >> $env:GITHUB_OUTPUT

      - name: Package
        working-directory: build
        run: 7z a "..\${{ steps.ver.outputs.zip }}" vMenu

      - uses: actions/upload-artifact@v7
        with:
          name: vMenu-ox-${{ steps.ver.outputs.name }}
          path: ${{ steps.ver.outputs.zip }}

      - name: Update dev prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          ZIP: ${{ steps.ver.outputs.zip }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          cp "$ZIP" vMenu-ox-dev.zip
          {
            echo "Development build from [\`${GITHUB_SHA:0:7}\`]($COMMIT_URL)."
            echo
            echo "Built automatically on every push to \`main\`. Not for production servers; use the latest stable release instead."
          } > notes.md

          if gh release view dev > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/dev" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release upload dev vMenu-ox-dev.zip --clobber
            gh release edit dev --notes-file notes.md --prerelease
          else
            gh release create dev vMenu-ox-dev.zip --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "vMenu-ox dev build" --notes-file notes.md
          fi

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          ZIP: ${{ steps.ver.outputs.zip }}
        run: |
          # Diff the notes against the last stable release, not the moving "dev" tag.
          prev=$(gh release list --exclude-pre-releases --exclude-drafts -L 1 --json tagName --jq '.[0].tagName // empty')
          gh release create "$GITHUB_REF_NAME" "$ZIP" --title "vMenu-ox $GITHUB_REF_NAME" --generate-notes --verify-tag \
            ${prev:+--notes-start-tag "$prev"}
